version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, security]

  - package-ecosystem: npm
    directory: /portal/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, security]

  - package-ecosystem: gomod
    directory: /cli
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, security]

  - package-ecosystem: docker
    directory: /management-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    # The platform is pinned to Java 25.0.3 LTS (see README.md). A JDK move is a governed change that must
    # revalidate OAuth2, migrations, authorization, and CLI evidence flows, so it is not accepted as a
    # dependency bump. PRs #4 and #7 proposing eclipse-temurin-26 were closed for this reason.
    ignore:
      - dependency-name: maven
        versions: ["3.9.15-eclipse-temurin-26"]
      - dependency-name: maven
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /portal
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, security]
    # The platform is pinned to Java 25.0.3 LTS (see README.md). A JDK move is a governed change that must
    # revalidate OAuth2, migrations, authorization, and CLI evidence flows, so it is not accepted as a
    # dependency bump. PRs #4 and #7 proposing eclipse-temurin-26 were closed for this reason.
    ignore:
      - dependency-name: maven
        versions: ["3.9.15-eclipse-temurin-26"]
      - dependency-name: maven
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, security]
