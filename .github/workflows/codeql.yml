name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL · ${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Java and Kotlin
            language: java-kotlin
            build_mode: manual
          - label: Go
            language: go
            build_mode: manual
          - label: JavaScript and TypeScript
            language: javascript-typescript
            build_mode: none
          - label: GitHub Actions
            language: actions
            build_mode: none
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Go 1.24
        if: matrix.language == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: cli/go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          queries: security-extended,security-and-quality

      - name: Build Java application for CodeQL
        if: matrix.language == 'java-kotlin'
        run: mvn --batch-mode --no-transfer-progress -DskipTests package

      - name: Build Go CLI for CodeQL
        if: matrix.language == 'go'
        working-directory: cli
        run: go build -trimpath -buildvcs=false ./cmd/aisdlc

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
