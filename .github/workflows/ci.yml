name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java 25 · Maven verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify management server and SSR portal
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Verify production topology invariants
        run: bash scripts/verify-production.sh
      - name: Publish JVM test reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: maven-test-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore

  cli:
    name: Go 1.24 · CLI verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: cli/go.mod
      - name: Format check
        working-directory: cli
        run: test -z "$(gofmt -l cmd internal)"
      - name: Test and compile deterministic validator
        working-directory: cli
        run: |
          go test ./...
          go build -trimpath -buildvcs=false ./cmd/aisdlc

  frontend:
    name: React Islands · production build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json
      - name: Install reproducibly and build Vite assets
        working-directory: portal/frontend
        run: |
          npm ci --ignore-scripts
          npm run build

  integration:
    name: Docker Compose integration smoke
    needs: [java, cli, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Start hardened topology and verify public health surfaces
        run: bash scripts/integration-smoke.sh
      - name: Publish Compose diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: compose-integration-logs
          path: target-compose-integration.log
          if-no-files-found: ignore

  dependency-review:
    name: Pull request dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v5

  osv-pr:
    name: OSV dependency scan · new pull request findings
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0

  osv-full:
    name: OSV dependency scan · full repository
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0

  trivy:
    name: Trivy repository and production-image scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - name: Test Trivy SARIF policy parser
        run: sh scripts/test-trivy-sarif-policy.sh

      - name: Enforce Trivy exception expiry policy
        run: node scripts/validate-trivy-ignore-expiry.mjs .trivyignore.yaml

      - name: Scan dependencies, secrets, and infrastructure as code
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-filesystem.sarif
          ignorefile: .trivyignore.yaml
          # Findings are evaluated from SARIF after all reports upload.
          # Operational scanner failures still make this step fail.
          exit-code: '0'
          cache: true

      - name: Build production images for image security scanning
        run: |
          docker build --file management-server/Dockerfile --tag aisdlc-management-server:security .
          docker build --file portal/Dockerfile --tag aisdlc-portal:security .

      - name: Scan management server production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aisdlc-management-server:security
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-management-server.sarif
          ignorefile: .trivyignore.yaml
          exit-code: '0'
          cache: true

      - name: Scan portal production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aisdlc-portal:security
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-portal.sarif
          ignorefile: .trivyignore.yaml
          exit-code: '0'
          cache: true

      - name: Upload Trivy filesystem findings to code scanning
        if: always() && hashFiles('trivy-filesystem.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-filesystem.sarif
          category: trivy-filesystem

      - name: Upload Trivy management server findings to code scanning
        if: always() && hashFiles('trivy-management-server.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-management-server.sarif
          category: trivy-management-server

      - name: Upload Trivy portal findings to code scanning
        if: always() && hashFiles('trivy-portal.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-portal.sarif
          category: trivy-portal

      - name: Retain Trivy evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-security-reports
          path: trivy-*.sarif
          if-no-files-found: warn

      - name: Enforce Trivy security policy
        if: always()
        run: node scripts/enforce-trivy-sarif-policy.mjs trivy-filesystem.sarif trivy-management-server.sarif trivy-portal.sarif
