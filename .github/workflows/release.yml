name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  osv:
    name: OSV dependency scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.0

  trivy:
    name: Trivy release filesystem scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Test Trivy SARIF policy parser
        run: sh scripts/test-trivy-sarif-policy.sh
      - name: Enforce Trivy exception expiry policy
        run: node scripts/validate-trivy-ignore-expiry.mjs .trivyignore.yaml
      - name: Scan release source for vulnerabilities, secrets, and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-release.sarif
          ignorefile: .trivyignore.yaml
          # The SARIF policy step below evaluates HIGH/CRITICAL findings after evidence upload.
          exit-code: '0'
          cache: true
      - name: Upload Trivy findings to code scanning
        if: always() && hashFiles('trivy-release.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-release.sarif
          category: trivy-release
      - name: Retain Trivy release evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: trivy-release-report
          path: trivy-release.sarif
          if-no-files-found: warn
      - name: Enforce Trivy release security policy
        if: always()
        run: node scripts/enforce-trivy-sarif-policy.mjs trivy-release.sarif

  release:
    name: Assemble and publish signed-by-checksum release
    needs: [osv, trivy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: cli/go.mod
      - name: Verify and package JVM applications
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Build reproducible CLI artifacts
        working-directory: cli
        run: |
          mkdir -p ../dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o ../dist/aisdlc-linux-amd64 ./cmd/aisdlc
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -buildvcs=false -ldflags='-s -w' -o ../dist/aisdlc-darwin-arm64 ./cmd/aisdlc
      - name: Collect release artifacts and SHA-256 checksums
        run: |
          mkdir -p dist
          cp management-server/target/management-server-*.jar dist/
          cp portal/target/portal-*.jar dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
