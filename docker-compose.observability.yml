# Observability gateway overlay.
#
# Deliberately a separate file rather than a profile in docker-compose.yml. Compose interpolates every service's
# variables at parse time regardless of profile, so a profile-gated service using ${VAR:?} required syntax breaks
# `docker compose up` for the whole topology when those variables are unset. A separate file is never parsed unless
# it is named, which is the isolation a profile only appears to give.
#
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up
#
# Required at deployment time: OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_AUTH_TOKEN, OTEL_EXPORTER_SERVER_NAME, and
# the mTLS material under AISDLC_OTEL_TLS_DIR. None is committed.

services:

  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:45392d534c1edcc809c2d112394029246bc679d2ae5ea7081414a1fc74f2c621
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otelcol-gateway.yaml:/etc/otelcol/config.yaml:ro
      - ${AISDLC_OTEL_TLS_DIR:-./infra/observability/tls}:/etc/otelcol/tls:ro
    environment:
      OTEL_OTLP_GRPC_ENDPOINT: 0.0.0.0:4317
      OTEL_OTLP_HTTP_ENDPOINT: 0.0.0.0:4318
      OTEL_TLS_CERT_FILE: /etc/otelcol/tls/collector.crt
      OTEL_TLS_KEY_FILE: /etc/otelcol/tls/collector.key
      OTEL_TLS_CLIENT_CA_FILE: /etc/otelcol/tls/client-ca.crt
      OTEL_MEMORY_LIMIT_MIB: ${OTEL_MEMORY_LIMIT_MIB:-384}
      OTEL_MEMORY_SPIKE_LIMIT_MIB: ${OTEL_MEMORY_SPIKE_LIMIT_MIB:-96}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?set OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_AUTH_TOKEN: ${OTEL_EXPORTER_AUTH_TOKEN:?set OTEL_EXPORTER_AUTH_TOKEN}
      OTEL_EXPORTER_CA_FILE: /etc/otelcol/tls/backend-ca.crt
      OTEL_EXPORTER_SERVER_NAME: ${OTEL_EXPORTER_SERVER_NAME:?set OTEL_EXPORTER_SERVER_NAME}
    expose:
      - "4317"
      - "4318"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    user: "10001:10001"
    restart: unless-stopped
