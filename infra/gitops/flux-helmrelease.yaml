# Flux reference, equivalent to the Argo CD application. Use one or the other, not both against the same namespace.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ai-sdlc
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/xdev-ai/ai-sdlc.git
  ref:
    # A tag, not a branch: the deployed revision must be reviewable and reproducible.
    tag: v0.1.0
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ai-sdlc
  namespace: ai-sdlc
spec:
  interval: 10m
  chart:
    spec:
      chart: infra/helm/ai-sdlc
      sourceRef:
        kind: GitRepository
        name: ai-sdlc
        namespace: flux-system
  install:
    remediation:
      retries: 2
  upgrade:
    # A failed upgrade rolls back automatically. A half-applied control plane is worse than the previous release.
    remediation:
      retries: 2
      remediateLastFailure: true
      strategy: rollback
  rollback:
    cleanupOnFail: true
    recreate: false
  valuesFrom:
    - kind: ConfigMap
      name: ai-sdlc-values
    - kind: Secret
      name: ai-sdlc-image-digests
      optional: false
