name: ai-sdlc

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aisdlc}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init-keycloak-db.sql:/docker-entrypoint-initdb.d/10-create-keycloak-db.sql:ro
    networks: [platform]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    command: start-dev --import-realm --hostname http://auth.localhost:8180 --proxy-headers xforwarded
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?set KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Consumed by $(env:...) placeholders in the realm import so Keycloak and its clients agree on one
      # secret. Without these the import generates a random secret and no client can authenticate.
      PORTAL_CLIENT_SECRET: ${PORTAL_CLIENT_SECRET:?set PORTAL_CLIENT_SECRET}
      CLI_CLIENT_SECRET: ${CLI_CLIENT_SECRET:?set CLI_CLIENT_SECRET}
      AGENT_RUNTIME_CLIENT_SECRET: ${AGENT_RUNTIME_CLIENT_SECRET:-unset-agent-runtime-secret}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:?set LOCAL_ADMIN_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ./infra/keycloak/ai-sdlc-realm.json:/opt/keycloak/data/import/ai-sdlc-realm.json:ro
    networks: [platform]

  identity-gateway:
    image: nginx:1.29-alpine
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8180:8080"
    volumes:
      - ./infra/nginx/keycloak.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=0,gid=0,mode=0755
      - /tmp:uid=101,gid=101,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    networks: [platform]

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AISDLC_EVIDENCE_S3_ACCESS_KEY:?set AISDLC_EVIDENCE_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${AISDLC_EVIDENCE_S3_SECRET_KEY:?set AISDLC_EVIDENCE_S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
      - "9001"
    networks: [platform]

  evidence-bucket-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    environment:
      AISDLC_EVIDENCE_S3_ACCESS_KEY: ${AISDLC_EVIDENCE_S3_ACCESS_KEY:?set AISDLC_EVIDENCE_S3_ACCESS_KEY}
      AISDLC_EVIDENCE_S3_SECRET_KEY: ${AISDLC_EVIDENCE_S3_SECRET_KEY:?set AISDLC_EVIDENCE_S3_SECRET_KEY}
      AISDLC_EVIDENCE_S3_BUCKET: ${AISDLC_EVIDENCE_S3_BUCKET:-aisdlc-evidence}
    # The pinned MinIO server image intentionally contains neither curl nor wget.
    # `mc ready` retries the official quorum readiness endpoint until storage is usable.
    entrypoint: ["/bin/sh", "-ec", "until mc alias set storage http://minio:9000 \"$${AISDLC_EVIDENCE_S3_ACCESS_KEY}\" \"$${AISDLC_EVIDENCE_S3_SECRET_KEY}\"; do sleep 1; done; mc ready storage; mc mb --ignore-existing --with-lock storage/\"$${AISDLC_EVIDENCE_S3_BUCKET}\""]
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    networks: [platform]

  management-server:
    build:
      context: .
      dockerfile: management-server/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aisdlc}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://auth.localhost:8180/realms/ai-sdlc
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/ai-sdlc/protocol/openid-connect/certs
      AISDLC_EVIDENCE_S3_ENDPOINT: http://minio:9000
      AISDLC_EVIDENCE_S3_REGION: ${AISDLC_EVIDENCE_S3_REGION:-us-east-1}
      AISDLC_EVIDENCE_S3_BUCKET: ${AISDLC_EVIDENCE_S3_BUCKET:-aisdlc-evidence}
      AISDLC_EVIDENCE_S3_ACCESS_KEY: ${AISDLC_EVIDENCE_S3_ACCESS_KEY:?set AISDLC_EVIDENCE_S3_ACCESS_KEY}
      AISDLC_EVIDENCE_S3_SECRET_KEY: ${AISDLC_EVIDENCE_S3_SECRET_KEY:?set AISDLC_EVIDENCE_S3_SECRET_KEY}
      AISDLC_EVIDENCE_S3_FORCE_PATH_STYLE: "true"
      # Inbound webhook verification. Empty means the connector refuses every delivery rather than trusting it.
      AISDLC_GITHUB_WEBHOOK_SECRET: ${AISDLC_GITHUB_WEBHOOK_SECRET:-}
      # AES-256-GCM key for notification destinations and webhook signing secrets. Never reached the container before,
      # so every notification-channel create in this topology failed with HTTP 409 "must be a 32-byte base64url value".
      AISDLC_NOTIFICATION_ENCRYPTION_KEY: ${AISDLC_NOTIFICATION_ENCRYPTION_KEY:-}
      AISDLC_TELEMETRY_ENABLED: ${AISDLC_TELEMETRY_ENABLED:-false}
      AISDLC_TELEMETRY_EXPORTER_ENDPOINT: ${AISDLC_TELEMETRY_EXPORTER_ENDPOINT:-}
      AISDLC_TELEMETRY_TRACE_SAMPLE_RATIO: ${AISDLC_TELEMETRY_TRACE_SAMPLE_RATIO:-0.1}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      evidence-bucket-init:
        condition: service_completed_successfully
    expose:
      - "8081"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    extra_hosts:
      - "auth.localhost:host-gateway"
    networks: [platform]

  portal:
    build:
      context: .
      dockerfile: portal/Dockerfile
    environment:
      MANAGEMENT_API_BASE_URL: http://management-server:8081
      KEYCLOAK_PUBLIC_BASE_URL: http://auth.localhost:8180
      KEYCLOAK_INTERNAL_BASE_URL: http://identity-gateway:8080
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID: aisdlc-portal
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET: ${PORTAL_CLIENT_SECRET:?set PORTAL_CLIENT_SECRET}
      AISDLC_TELEMETRY_ENABLED: ${AISDLC_TELEMETRY_ENABLED:-false}
      AISDLC_TELEMETRY_EXPORTER_ENDPOINT: ${AISDLC_TELEMETRY_EXPORTER_ENDPOINT:-}
      AISDLC_TELEMETRY_TRACE_SAMPLE_RATIO: ${AISDLC_TELEMETRY_TRACE_SAMPLE_RATIO:-0.1}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
    depends_on:
      management-server:
        condition: service_started
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    extra_hosts:
      - "auth.localhost:host-gateway"
    networks: [platform]

networks:
  platform:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
